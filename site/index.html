.a11y-floating .a11y-panel { top: auto; bottom: calc(100% + 10px); }
.a11y-head { display: flex; align-items: center; justify-content: space-between; }
.a11y-head b { font-size: var(--fs-lg); }
.a11y-size { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.a11y-steps { display: flex; gap: 8px; }
.a11y-step { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 700; display: grid; place-items: center; }
.a11y-step.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.a11y-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.a11y-opt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 76px; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); cursor: pointer; font: inherit; font-size: var(--fs-sm); font-weight: 500; text-align: center; }
.a11y-opt svg { width: 22px; height: 22px; color: var(--ink-2); }
.a11y-opt.on { background: var(--accent-soft); border-color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent-strong); }
.a11y-opt.on svg { color: var(--accent-strong); }
.a11y-foot { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 760px) { .shell .a11y-floating { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

/* the settings themselves */
html[data-text-size="1"] { font-size: 112.5%; }
html[data-text-size="2"] { font-size: 125%; }
html[data-text-size="3"] { font-size: 140%; }
html[data-links] a, html[data-links] .linkish, html[data-links] .crumbs button { text-decoration: underline !important; text-underline-offset: 3px; font-weight: 600; }
html[data-plain] { --font-display: Arial, "Assistant", "Segoe UI", sans-serif; --font-body: Arial, "Assistant", "Segoe UI", sans-serif; }
html[data-plain] body { letter-spacing: 0.01em; word-spacing: 0.06em; }
html[data-still] *, html[data-still] *::before, html[data-still] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
html[data-hc] {
  --bg: #FFFFFF; --paper: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2; --surface-3: #E6E6E6;
  --line: #6B6B6B; --line-strong: #2B2B2B; --ink: #000000; --ink-2: #111111; --ink-3: #222222;
  --navy: #000000; --navy-2: #000000; --navy-3: #1A1A1A; --on-navy: #FFFFFF; --on-navy-2: #F0F0F0;
  --accent: #005A50; --accent-hover: #00433B; --accent-bright: #7FF0E2; --accent-ink: #FFFFFF; --accent-soft: #D2F5F0;
  --ok: #0B5A36; --warn: #6B3F00; --bad: #8A1414; --info: #12407A; --violet: #4A2780;
  --shadow-1: none; --shadow-2: none; --shadow-3: 0 0 0 2px #000;
}
html[data-hc] .card, html[data-hc] .btn, html[data-hc] .input, html[data-hc] .select, html[data-hc] .textarea, html[data-hc] .badge, html[data-hc] .chip { border-width: 1.5px; border-color: var(--line-strong); }
html[data-hc] :focus-visible { outline: 3px solid #000 !important; outline-offset: 3px; box-shadow: 0 0 0 6px #FFD400 !important; }
html[data-hc] .sidebar, html[data-hc] .hero { background-image: none !important; }
.reading-guide { position: fixed; inset: 0 0 auto 0; top: -22px; height: 44px; z-index: 300; pointer-events: none; background: rgba(var(--accent-rgb), 0.08); border-block: 2px solid var(--accent); }

/* ---------- skip link ---------- */
.skip-link { position: fixed; top: 8px; right: 8px; z-index: 400; background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; transform: translateY(-150%); transition: transform .15s; }
.skip-link:focus { transform: none; }

/* ---------- accessibility statement ---------- */
.statement { max-width: 760px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 120px; display: flex; flex-direction: column; gap: 16px; font-size: var(--fs-lg); line-height: 1.75; }
.statement-head { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.statement-head h1 { font-size: var(--fs-3xl); line-height: 1.15; }
.statement-ic { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; flex: 0 0 56px; }
.statement-ic svg { width: 28px; height: 28px; }
.statement h2 { font-size: var(--fs-xl); margin-top: 20px; }
.statement-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.statement-list li { display: flex; gap: 12px; align-items: flex-start; padding: 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.statement-list svg { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 4px; color: var(--accent-strong); }
.statement-contact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px; }
.a11y-grid .a11y-opt:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 56px; flex-direction: row; }

/* ArchiFlow – color and motion layer: the peach → pink → lilac gradient, a living banner,
   staggered entrances, filling bars and a little celebration. Everything here is switched off by
   prefers-reduced-motion and by "עצירת אנימציות" in the accessibility menu (html[data-still]). */

/* ---------- ambience ---------- */
body { background:
  radial-gradient(900px 520px at 100% -10%, rgba(var(--accent-rgb), 0.16), transparent 60%),
  radial-gradient(700px 480px at -10% 110%, rgba(217, 165, 201, 0.14), transparent 60%),
  var(--bg); background-attachment: fixed; }

/* ---------- sidebar: deep plum with a soft vertical sheen ---------- */
.sidebar { background-image:
  linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.12)),
  linear-gradient(var(--blueprint-faint) 1px, transparent 1px),
  linear-gradient(90deg, var(--blueprint-faint) 1px, transparent 1px); background-size: auto, 24px 24px, 24px 24px; }
.sb-item svg { transition: transform .2s var(--ease); }
.sb-item:hover svg { transform: translateX(-2px) scale(1.06); }
.sb-item.active { background: linear-gradient(270deg, rgba(var(--accent-rgb), 0.30), rgba(var(--accent-rgb), 0.06)); }
.sb-item.active::before { background: var(--grad) !important; width: 4px; }
.sb-name span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent !important; }

/* ---------- primary buttons: gradient with a shine sweep on hover ---------- */
.btn.primary, .hero .btn.primary { background: var(--grad) !important; background-size: 170% 100% !important; background-position: 100% 0 !important; border-color: transparent !important; color: var(--accent-ink) !important; position: relative; overflow: hidden; transition: background-position .6s var(--ease), box-shadow .2s, transform .08s; }
.btn.primary:hover, .hero .btn.primary:hover { background-position: 0 0 !important; box-shadow: 0 8px 22px -8px rgba(var(--accent-rgb), 0.9); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; inset-inline-start: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent); transform: skewX(-18deg); pointer-events: none; }
.btn.primary:hover::after { animation: shine .8s var(--ease); }
@keyframes shine { to { inset-inline-start: 130%; } }
.tb-new .tb-plus { background: var(--grad) !important; }

/* ---------- the banner: an aurora drifting behind the greeting ---------- */
.hero { isolation: isolate; }
.hero::before, .hero::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; filter: blur(46px); opacity: .55; pointer-events: none; }
.hero::before { width: 420px; height: 420px; top: -180px; left: -80px; background: radial-gradient(circle, #EFB0A1, transparent 65%); animation: drift1 16s ease-in-out infinite alternate; }
.hero::after { width: 380px; height: 380px; bottom: -220px; left: 30%; background: radial-gradient(circle, #D9A5C9, transparent 65%); animation: drift2 19s ease-in-out infinite alternate; }
@keyframes drift1 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(140px, 60px) scale(1.15); } 100% { transform: translate(60px, 120px) scale(.95); } }
@keyframes drift2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-160px, -50px) scale(1.2); } 100% { transform: translate(80px, -90px) scale(1); } }
.hero-title { background: linear-gradient(90deg, #FFFFFF 30%, #FBD9D2 70%, #F4C6DA); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
.hero-cell .hc-v { font-variant-numeric: tabular-nums; }
.hero-cell { transition: background .2s, transform .2s var(--ease); }
.hero-cell:hover { background: rgba(255,255,255,0.07); }
.hero-cell:hover .hc-v { transform: translateY(-1px); }
.hero-cell .hc-v { display: inline-block; transition: transform .2s var(--ease); }

/* the same aurora on the sign-in art panel */
.auth-art { isolation: isolate; }
.auth-art::before, .auth-art::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; filter: blur(60px); opacity: .45; pointer-events: none; }
.auth-art::before { width: 520px; height: 520px; bottom: -160px; right: -120px; background: radial-gradient(circle, #EFB0A1, transparent 65%); animation: drift2 22s ease-in-out infinite alternate; }
.auth-art::after { width: 460px; height: 460px; top: 10%; left: -160px; background: radial-gradient(circle, #D9A5C9, transparent 65%); animation: drift1 18s ease-in-out infinite alternate; }
.auth-art > * { z-index: 1; }

/* ---------- entrances: cards rise in one after another (fill "backwards" leaves no transform behind) ---------- */
@keyframes riseIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.content .hero, .content .page-head,
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .grid-main-side, .grid-rail, .kanban) > :is(.card, section, article, .k-col, .stat) { animation: riseIn .55s var(--ease) backwards; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(2) { animation-delay: .05s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(3) { animation-delay: .1s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(4) { animation-delay: .15s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(5) { animation-delay: .2s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(6) { animation-delay: .25s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(n+7) { animation-delay: .3s; }
.content .li { animation: fadeIn .4s var(--ease) backwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- cards: soft rosy glow on hover ---------- */
.card.link:hover { box-shadow: 0 16px 34px -16px rgba(var(--accent-rgb), 0.75), var(--shadow-1); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.pcard .pc-status { backdrop-filter: blur(6px); }

/* ---------- bars fill in ---------- */
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.prog > i { transform-origin: right center; animation: growX 1s var(--ease) backwards .15s; }
.prog.accent > i { background: var(--grad); }
.ptl-bar { transform-origin: right center; animation: growX .9s var(--ease) backwards; }
.ptl-row:nth-child(2) .ptl-bar { animation-delay: .06s; } .ptl-row:nth-child(3) .ptl-bar { animation-delay: .12s; } .ptl-row:nth-child(4) .ptl-bar { animation-delay: .18s; }
.ptl-row:nth-child(5) .ptl-bar { animation-delay: .24s; } .ptl-row:nth-child(n+6) .ptl-bar { animation-delay: .3s; }
.ptl-today { animation: fadeIn .6s ease .7s backwards; }
.ptl-today span { background: var(--grad); }

/* ---------- small delights ---------- */
.tab.on { border-image: var(--grad) 1; border-bottom-width: 3px; }
.chip.on { background: var(--navy); }
.badge.st .bd { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.k-card:hover, .k-card:focus-visible { transform: translateY(-2px); }
.toast { animation: toastIn .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
.verified-badge { animation: pop .6s cubic-bezier(.2, 1.5, .4, 1) .1s backwards; background: var(--grad) !important; color: var(--accent-ink) !important; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.empty .e-ic { background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, #D9A5C9 22%, var(--surface))); color: var(--accent-strong); }

/* confetti pieces (created by src/ui/confetti.ts) */
.confetti-piece { position: fixed; z-index: 500; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; will-change: transform, opacity; }

/* ---------- respect people who prefer less motion ---------- */
@media (prefers-reduced-motion: reduce) { .hero::before, .hero::after, .auth-art::before, .auth-art::after { animation: none; } }
html[data-still] .hero::before, html[data-still] .hero::after, html[data-still] .auth-art::before, html[data-still] .auth-art::after { animation: none !important; }
html[data-hc] .hero::before, html[data-hc] .hero::after, html[data-hc] .auth-art::before, html[data-hc] .auth-art::after { display: none; }
html[data-hc] .hero-title, html[data-hc] .sb-name span { background: none; color: inherit !important; }
html[data-hc] .btn.primary { background: #000 !important; color: #fff !important; }

/* ---------- invitation to the demo (live sign-in) and back to the real site (demo strip) ---------- */
.demo-cta { display: flex; align-items: center; gap: 12px; padding: 16px 16px; border-radius: 14px; text-decoration: none; color: var(--ink); background: linear-gradient(120deg, color-mix(in srgb, #EFB0A1 22%, var(--surface)), color-mix(in srgb, #D9A5C9 20%, var(--surface))); border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); transition: transform .2s var(--ease), box-shadow .2s; }
.demo-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -14px rgba(var(--accent-rgb), .9); }
.demo-cta .grow { display: flex; flex-direction: column; }
.demo-cta-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; flex: 0 0 40px; color: var(--accent-ink); }
.demo-cta-ic svg { width: 20px; height: 20px; }
.demo-cta > svg { width: 18px; height: 18px; color: var(--accent-strong); }
.demo-strip-cta { margin-inline-start: auto; font-weight: 700; color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; }

/* ArchiFlow – the architect workflow: phases, permit, site supervision, brief, mood board, library, branding. */

/* ---------- phases ---------- */
.phase-list { list-style: none; margin: 0; padding: 0; }
.phase-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--line); align-items: start; position: relative; }
.phase-row:first-child { border-top: 0; }
.phase-row.active { background: linear-gradient(270deg, rgba(var(--accent-rgb), .14), transparent 70%); }
.phase-row.active::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--grad); }
.pr-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-sm); background: var(--surface-3); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.phase-row.active .pr-n { background: var(--grad); color: var(--accent-ink); }
.phase-row.done .pr-n { background: var(--ok-soft); color: var(--ok); }
.pr-n svg { width: 16px; height: 16px; }
.pr-name { font-size: var(--fs-md); font-weight: 600; margin: 0; font-family: var(--font-body); }
.phase-row.done .pr-name { color: var(--ink-2); }
.pr-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pr-fees { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.pr-act { justify-content: flex-end; }
@media (max-width: 700px) { .phase-row { grid-template-columns: 30px minmax(0, 1fr); } .pr-act { grid-column: 2; justify-content: flex-start; } }
.phases.on-dark .phase .bar { background: rgba(255, 255, 255, .16); }
.phases.on-dark .phase.done .bar { background: var(--ok); }
.phases.on-dark .phase.now .bar { background: var(--grad); }
.phases.on-dark .phase .ph-label { color: var(--on-navy-2); }
.phases.on-dark .phase.now .ph-label { color: var(--accent-bright); }
.prog.sm { height: 5px; }
.profit-line { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px; border-radius: var(--r-md); font-size: var(--fs-md); }
.profit-line b { font-size: var(--fs-xl); margin-inline-start: auto; }
.profit-line.ok { background: var(--ok-soft); color: var(--ok); }
.profit-line.warn { background: var(--warn-soft); color: var(--warn); }
.profit-line.bad { background: var(--bad-soft); color: var(--bad); }

.tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .tpl-grid { grid-template-columns: 1fr; } }
.tpl-opt { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: var(--r-md); cursor: pointer; transition: border-color .15s, background .15s; }
.tpl-opt:hover { border-color: var(--line-strong); }
.tpl-opt.on { border-color: var(--accent-strong); background: var(--accent-soft); }
.tpl-opt:focus-within { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
.tpl-preview { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.tpl-preview li span:first-child { display: inline-block; min-width: 60%; }
.tpl-preview li { display: list-item; }
.tpl-preview li .muted { float: left; }

/* ---------- time ---------- */
.week-bars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; height: 170px; align-items: end; }
.wb { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
.wb-v { font-size: var(--fs-sm); font-weight: 600; min-height: 1.2em; }
.wb-bar { flex: 1; width: 100%; max-width: 54px; background: var(--surface-2); border-radius: var(--r-sm); display: flex; align-items: flex-end; overflow: hidden; }
.wb-bar i { display: block; width: 100%; background: var(--navy-3); border-radius: var(--r-sm); transform-origin: bottom; animation: growY .8s var(--ease) backwards; }
.wb.today .wb-bar i { background: var(--grad); }
.wb.today .wb-d { font-weight: 700; color: var(--ink); }
.wb-d { font-size: var(--fs-sm); color: var(--ink-3); }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.rates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px 28px; }

/* ---------- permit ---------- */
.permit-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; overflow-x: auto; }
.permit-steps li { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; min-width: 64px; }
.permit-steps li::before { content: ""; position: absolute; top: 7px; inset-inline-start: 50%; width: 100%; height: 2px; background: var(--line-strong); z-index: 0; }
.permit-steps li:last-child::before { display: none; }
.permit-steps li.done::before { background: var(--ok); }
.ps-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); position: relative; z-index: 1; }
.permit-steps li.done .ps-dot { background: var(--ok); border-color: var(--ok); }
.permit-steps li.now .ps-dot { background: var(--grad); border-color: var(--accent-strong); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .3); }
.ps-label { font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.3; }
.permit-steps li.now .ps-label { color: var(--ink); font-weight: 700; }
.permit-steps.compact .ps-label { display: none; }
.permit-steps.compact li { min-width: 0; }
.permit-steps.compact li.now .ps-label { display: block; position: absolute; top: 20px; white-space: nowrap; }
.permit-steps.compact { padding-bottom: 24px; }

/* ---------- site supervision ---------- */
.findings { display: flex; flex-direction: column; }
.finding { display: flex; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--line); }
.finding:first-child { border-top: 0; }
.finding-title { font-size: var(--fs-md); font-weight: 600; margin: 0; font-family: var(--font-body); }
.finding-photo { width: 84px; height: 84px; border-radius: var(--r-md); object-fit: cover; flex: 0 0 84px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
.finding-photo.none svg, .img-ph svg { width: 26px; height: 26px; opacity: .55; }
.finding-photo.none.high { background: var(--bad-soft); color: var(--bad); }
.finding-photo.none.medium { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 520px) { .finding-photo { width: 64px; height: 64px; flex-basis: 64px; } }
.sev-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; background: var(--line-strong); }
.sev-dot.high { background: var(--bad); } .sev-dot.medium { background: var(--warn); }
.img-ph { display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); }
.mt4 { margin-top: 4px; } .mt12 { margin-top: 12px; }
.pre-wrap { white-space: pre-wrap; margin: 0; }
.field .lbl { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }

.site-report { display: flex; flex-direction: column; gap: 8px; }
.sr-head { display: flex; gap: 16px; align-items: center; padding-bottom: 16px; border-bottom: 3px solid var(--brand, var(--navy)); margin-bottom: 12px; }
.sr-title { font-size: var(--fs-2xl); margin: 0; }
.site-report h3 { font-size: var(--fs-lg); margin: 0; }
.sr-findings { margin: 0; padding-inline-start: 24px; display: flex; flex-direction: column; gap: 12px; }
.sr-findings li { padding-inline-start: 4px; }
.sr-findings li > div, .sr-findings li { overflow: hidden; }
.sr-photo { float: left; width: 120px; height: 90px; object-fit: cover; border-radius: var(--r-sm); margin-inline-start: 12px; }
.sr-foot { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); }
.t-left { text-align: left; }
@media print {
  body * { visibility: hidden !important; }
  .print-area, .print-area * { visibility: visible !important; }
  .print-area { position: absolute; inset: 0; padding: 12mm; background: #fff; color: #000; }
  .scrim, .modal { position: static !important; background: none !important; box-shadow: none !important; overflow: visible !important; max-height: none !important; }
  .print-area .sr-findings li { break-inside: avoid; }
}

/* ---------- brief ---------- */
.brief-answers { display: flex; flex-direction: column; gap: 20px; }
.brief-answers h3 { font-size: var(--fs-md); margin: 0 0 8px; color: var(--accent-strong); font-family: var(--font-body); }
.brief-answers dl { margin: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px 20px; }
.brief-answers dt { font-size: var(--fs-sm); color: var(--ink-3); }
.brief-answers dd { margin: 0; white-space: pre-wrap; }
@media (max-width: 640px) { .brief-answers dl { grid-template-columns: 1fr; gap: 2px; } .brief-answers dd { margin-bottom: 12px; } }
.brief-q { min-width: 0; border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.brief-q legend { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); margin-bottom: 8px; padding: 0; }
.brief-hero { display: flex; gap: 16px; align-items: center; }
.sticky-actions { position: sticky; bottom: 0; padding: 12px 0; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }

/* ---------- mood board ---------- */
.mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.mood { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); display: flex; flex-direction: column; transition: transform .2s var(--ease), box-shadow .2s; }
.mood:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.mood.private { border-style: dashed; }
.mood.private .mood-img { opacity: .78; }
.mood-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.mood-color { display: flex; align-items: flex-end; padding: 12px; font-size: var(--fs-sm); font-weight: 600; }
.mood-note { background: color-mix(in srgb, var(--warn-soft) 70%, var(--surface)); padding: 16px; overflow: hidden; }
.mood-note p { margin: 0; font-size: var(--fs-sm); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.mood-body { padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.mood-comment { background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 8px; }
.react-btn { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; }
.react-btn:hover { border-color: var(--line-strong); }
.react-btn.love.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.react-btn.maybe.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.react-btn.no.on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.react-btn.on { font-weight: 700; }

/* ---------- library ---------- */
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.lib-card { overflow: hidden; display: flex; flex-direction: column; }
.lib-img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.lib-name { font-size: var(--fs-md); margin: 0; font-family: var(--font-body); font-weight: 600; }

/* ---------- branding ---------- */
.brand-initials { border-radius: 50%; background: var(--brand, var(--navy)); color: var(--brand-ink, var(--on-navy)); display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 700; flex: 0 0 auto; }
.brand-logo { width: auto; object-fit: contain; display: block; flex: 0 0 auto; }
.brand-swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; display: grid; place-items: center; padding: 0; }
.brand-swatch.on { box-shadow: 0 0 0 3px var(--accent-strong); }
.brand-swatch svg { width: 18px; height: 18px; }
.brand-swatch.custom { background: conic-gradient(#E57373, #FFD54F, #81C784, #64B5F6, #BA68C8, #E57373); overflow: hidden; position: relative; }
.brand-swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.brand-swatch:disabled { cursor: default; opacity: .7; }
.brand-preview { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r-md); background: var(--brand); color: var(--brand-ink); }
.brand-preview .brand-initials { box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand-ink) 40%, transparent); }

/* the client portal wears the studio's color */
.portal .portal-hero { background-color: var(--brand, var(--navy)); }
.portal.brand-light .portal-hero { --on-navy: #1E1A1C; --on-navy-2: rgba(30, 26, 28, .78); --accent-bright: var(--accent-strong); color: #1E1A1C; }
.portal.brand-light .portal-hero h1 { color: #1E1A1C; }
.portal .portal-nav button.active { border-bottom-color: var(--brand, var(--accent)); }
html[data-hc] .portal .portal-hero { background-color: #000; }
.brief-q .chips { flex-wrap: wrap !important; overflow: visible !important; }
@media (max-width: 760px), (pointer: coarse) { .brand-swatch { width: var(--tap); height: var(--tap); } }

/* ArchiFlow – "the best of three" design layer (November 2026).
   A · clean and calm: quieter background, one focal point on the home screen, fewer competing buttons.
   C · architectural magazine: big bold Rubik headings and numbers, tight letter-spacing, thin rules.
   B · night: a glowing primary button and an accent bar on the active item in dark mode.
   Everything else comes from the tokens; motion is still switched off by reduced motion / "עצירת אנימציות". */

/* ---------- C: bold typography ---------- */
h1, h2, h3, .display, .page-head h1, .hero-title, .modal-head h2, .card-head h2, .sb-name, .public-top .brand { font-family: var(--font-display); }
.page-head h1 { font-size: clamp(1.75rem, 1.2rem + 1.6vw, 2.5rem); font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; }
.hero-title { font-weight: 800; font-size: clamp(2rem, 1.2rem + 2.6vw, 3.25rem); letter-spacing: -0.03em; line-height: 1.02; }
.portal-hero h1, .display { font-weight: 800; letter-spacing: -0.025em; }
.card-head h2 { font-weight: 700; letter-spacing: -0.01em; }
.modal-head h2 { font-weight: 800; letter-spacing: -0.015em; }
.sb-name { font-weight: 800; letter-spacing: -0.01em; }
/* numbers as a design element */
.s-value, .hero-cell .hc-v, .stat .s-value { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero-cell .hc-v { font-size: clamp(1.75rem, 1.4rem + 1vw, 2.25rem); }
/* small uppercase-style labels read as captions, not as content */
.eyebrow, .s-label, .hc-k { letter-spacing: 0.02em; }

/* ---------- A: calmer surfaces ---------- */
body { background:
  radial-gradient(900px 520px at 100% -10%, rgba(var(--accent-rgb), 0.08), transparent 60%),
  var(--bg); background-attachment: fixed; }
.hero::before, .hero::after { opacity: .38; }
.card { box-shadow: var(--shadow-1); }
.card.link:hover { box-shadow: 0 12px 28px -16px rgba(var(--accent-rgb), 0.6), var(--shadow-1); }

/* ---------- A: the focal point on the home screen ---------- */
.hero-focus { position: relative; z-index: 1; margin: 0 28px 24px; padding: 16px 20px; border-radius: var(--r-lg);
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); border-inline-start: 4px solid var(--accent-bright);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; color: var(--on-navy); }
.hero-focus .hf-ic { grid-row: 1 / 4; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--grad); color: var(--accent-ink); }
.hero-focus .hf-ic svg { width: 22px; height: 22px; }
.hero-focus .hf-tag, .hero-focus .hf-title, .hero-focus .hf-sub { grid-column: 2; min-width: 0; }
.hero-focus .hf-tag { font-size: var(--fs-xs); font-weight: 700; color: var(--accent-bright); letter-spacing: 0.02em; }
.hero-focus .hf-title { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg); line-height: 1.3; color: var(--on-navy); }
.hero-focus .hf-sub { font-size: var(--fs-sm); color: var(--on-navy-2); }
.hero-focus .hf-go { grid-column: 3; grid-row: 1 / 4; }
.hero-focus .hf-go.btn { background: var(--on-navy); color: var(--navy); border-color: transparent; font-weight: 700; }
.hero-focus .hf-go.btn:hover { background: #fff; }
.hero-focus .hf-more { font-size: var(--fs-xs); color: var(--on-navy-2); }
@media (max-width: 760px) {
  .hero-focus { margin: 0 16px 16px; grid-template-columns: auto minmax(0, 1fr); }
  .hero-focus .hf-ic { grid-row: 1 / 3; width: 40px; height: 40px; }
  .hero-focus .hf-sub { grid-column: 1 / 3; }
  .hero-focus .hf-go { grid-column: 1 / 3; grid-row: auto; margin-top: 8px; width: 100%; }
}
html[data-hc] .hero-focus { background: #000; border-color: #fff; }

/* ---------- B: night mode details ---------- */
:root[data-theme="dark"] .btn.primary { box-shadow: 0 8px 24px -10px rgba(var(--accent-rgb), 0.75); }
:root[data-theme="dark"] .sb-item.active { box-shadow: inset -3px 0 0 var(--accent-bright); }
:root[data-theme="dark"] .card { border-color: var(--line); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.primary { box-shadow: 0 8px 24px -10px rgba(var(--accent-rgb), 0.75); }
  :root:not([data-theme="light"]) .sb-item.active { box-shadow: inset -3px 0 0 var(--accent-bright); }
}

/* the plain-font accessibility option still wins */
html[data-plain] h1, html[data-plain] h2, html[data-plain] h3, html[data-plain] .s-value, html[data-plain] .hc-v { font-family: var(--font-body); letter-spacing: 0; }
