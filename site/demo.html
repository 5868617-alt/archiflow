/* page header */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { font-family: var(--font-display); font-size: var(--fs-3xl); font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
.page-head .ph-sub { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-3); margin-bottom: 6px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--ink-3); cursor: pointer; font-size: inherit; }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.crumbs svg { width: 12px; height: 12px; }
@media (max-width: 640px) { .page-head h1 { font-size: var(--fs-2xl); } }

/* ---------- Client portal shell ---------- */
.portal { min-height: 100vh; background: var(--paper); }
.portal-top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
.portal-top-inner { max-width: 1120px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); }
.portal-brand { display: flex; align-items: center; gap: 12px; }
.portal-logo { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: var(--accent-bright); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; flex: 0 0 40px; }
.portal-nav { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
.portal-nav button { background: none; border: 0; padding: 10px 14px; font-size: var(--fs-md); color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.portal-nav button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.portal-nav button svg { width: 15px; height: 15px; }
.portal-main { max-width: 1120px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 64px max(16px, env(safe-area-inset-right, 0px)); }
.portal-hero { background: var(--navy); color: var(--on-navy); border-radius: var(--r-lg); padding: 28px; position: relative; overflow: hidden; }
.portal-hero h1, .portal-hero h2 { color: var(--on-navy); }
.portal-hero::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--blueprint-faint) 1px, transparent 1px), linear-gradient(90deg, var(--blueprint-faint) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; mask-image: linear-gradient(to left, transparent 30%, #000); }
.portal-hero > * { position: relative; z-index: 1; }
.privacy-note { display: flex; gap: 8px; align-items: flex-start; background: var(--info-soft); color: var(--ink); border-radius: var(--r-md); padding: 10px 12px; font-size: var(--fs-sm); }
.privacy-note svg { width: 16px; height: 16px; color: var(--info); flex: 0 0 16px; margin-top: 2px; }

/* ---------- Super admin shell ---------- */
.shell.admin .sidebar { background-color: #0B0F18; background-image: none; }
.shell.admin .sb-item.active { background: rgba(var(--accent-rgb),0.16); }
.admin-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 3px; }
.admin-strip { background: #0B0F18; color: #7FDCD1; font-size: var(--fs-xs); padding: 5px max(16px, env(safe-area-inset-left, 0px)) 5px max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Public / auth ---------- */
.public { min-height: 100vh; background: var(--paper); }
.public-top { max-width: 1180px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-left, 0px)) 18px max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 16px; }
.public-top .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.public-top .brand span span { color: var(--accent-strong); }
.auth-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); min-height: 100vh; }
.auth-art { background: var(--navy); color: var(--on-navy); position: relative; overflow: hidden; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; }
.auth-form { display: flex; align-items: center; justify-content: center; padding: 40px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.auth-card { width: 100%; max-width: 420px; }
@media (max-width: 900px) { .auth-wrap { grid-template-columns: minmax(0, 1fr); } .auth-art { display: none; } }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 14px; border-radius: var(--r-md);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: var(--fs-md); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.btn svg { width: 16px; height: 16px; flex: 0 0 16px; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.navy { background: var(--navy-2); border-color: var(--navy-2); color: var(--on-navy); }
.btn.navy:hover { background: var(--navy-3); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink, #fff); }
.btn.sm { height: 30px; padding: 0 10px; font-size: var(--fs-sm); }
.btn.sm svg { width: 14px; height: 14px; }
.btn.xs { height: 26px; padding: 0 8px; font-size: var(--fs-xs); gap: 5px; }
.btn.xs svg { width: 13px; height: 13px; }
.btn.lg { height: 44px; padding: 0 20px; font-size: var(--fs-lg); }
.btn.block { width: 100%; }
.btn-group { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.btn-group button { border: 0; background: none; height: 34px; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink-2); font-size: var(--fs-sm); }
.btn-group button + button { border-inline-start: 1px solid var(--line); }
.btn-group button.on { background: var(--navy-2); color: var(--on-navy); }
.btn-group button svg { width: 15px; height: 15px; }

/* card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card.pad { padding: 18px; }
.card.flat { box-shadow: none; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-head h2, .card-head h3 { font-size: var(--fs-lg); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-head h2 svg, .card-head h3 svg { width: 17px; height: 17px; color: var(--ink-3); }
.card-body { padding: 16px 18px; }
.card-foot { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.card.link { cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .12s; }
.card.link:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
.card.tinted { background: var(--surface-2); }

/* stat tiles */
.stat { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.stat .s-label { font-size: var(--fs-sm); color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat .s-label svg { width: 15px; height: 15px; color: var(--ink-3); }
.stat .s-value { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -0.01em; }
.stat .s-meta { font-size: var(--fs-xs); color: var(--ink-3); }
.stat.alert { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.stat.alert .s-value { color: var(--bad); }
.stat.warn .s-value { color: var(--warn); }
.stat .s-go { position: absolute; left: 14px; top: 14px; width: 16px; height: 16px; color: var(--ink-3); opacity: 0; transition: opacity .12s; }
.card.link:hover .s-go { opacity: 1; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); line-height: 1; }
.badge .bd { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 6px; }
.badge svg { width: 12px; height: 12px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.violet { background: var(--violet-soft); color: var(--violet); }
.badge.accent { background: var(--accent-soft); color: var(--ink); }
.badge.navy { background: var(--navy-2); color: var(--on-navy); }
.badge.outline { background: none; border: 1px solid var(--line-strong); }
.tag-demo { display: inline-flex; align-items: center; gap: 5px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.02em; padding: 2px 7px; border-radius: 3px; border: 1px dashed var(--warn); color: var(--warn); background: var(--warn-soft); white-space: nowrap; }
.tag-demo svg { width: 11px; height: 11px; }
.tag-future { display: inline-flex; align-items: center; gap: 5px; font-size: 0.6875rem; font-weight: 600; padding: 2px 7px; border-radius: 3px; border: 1px dashed var(--violet); color: var(--violet); background: var(--violet-soft); white-space: nowrap; }
.tag-future svg { width: 11px; height: 11px; }

/* callouts */
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font-size: var(--fs-sm); }
.callout svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 1px; }
.callout.assume { border-style: dashed; border-color: var(--warn); background: var(--warn-soft); }
.callout.assume svg { color: var(--warn); }
.callout.info { background: var(--info-soft); border-color: transparent; }
.callout.info svg { color: var(--info); }
.callout.bad { background: var(--bad-soft); border-color: transparent; }
.callout.bad svg { color: var(--bad); }
.callout.ok { background: var(--ok-soft); border-color: transparent; }
.callout.ok svg { color: var(--ok); }
.callout.future { border-style: dashed; border-color: var(--violet); background: var(--violet-soft); }
.callout.future svg { color: var(--violet); }
.callout .c-title { font-weight: 600; margin-bottom: 2px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .label { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); }
.field .hint { font-size: var(--fs-xs); color: var(--ink-3); }
.field .err { font-size: var(--fs-xs); color: var(--bad); }
.input, .select, .textarea {
  width: 100%; height: 38px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface);
  padding: 0 11px; font-size: var(--fs-md); color: var(--ink); min-width: 0;
}
.textarea { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent-strong); box-shadow: 0 0 0 3px var(--blueprint-faint); }
.input.invalid, .select.invalid, .textarea.invalid { border-color: var(--bad); }
.input.sm, .select.sm { height: 32px; font-size: var(--fs-sm); }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: 14px 50%, 9px 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-left: 26px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--fs-md); }
.check input { width: 16px; height: 16px; accent-color: var(--navy-2); }
.switch { position: relative; width: 36px; height: 20px; flex: 0 0 36px; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 10px; cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; top: 2px; right: 2px; background: var(--surface); border-radius: 50%; transition: .15s; box-shadow: var(--shadow-1); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { right: 18px; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }

/* filter bar */
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters .search-in { position: relative; flex: 1 1 220px; max-width: 320px; }
.filters .search-in input { padding-right: 32px; height: 34px; }
.filters .search-in svg { position: absolute; right: 10px; top: 9px; width: 15px; height: 15px; color: var(--ink-3); }
.filters .select { height: 34px; width: auto; min-width: 130px; font-size: var(--fs-sm); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip.on { background: var(--navy-2); border-color: var(--navy-2); color: var(--on-navy); }
.chip .c-n { font-size: 0.6875rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin-bottom: 20px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font-size: var(--fs-md); color: var(--ink-2); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .t-n { font-size: 0.6875rem; background: var(--surface-3); padding: 1px 6px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.tab svg { width: 15px; height: 15px; }

/* table */
.table-wrap { overflow-x: auto; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.tbl th { text-align: right; font-weight: 500; font-size: var(--fs-sm); color: var(--ink-3); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--ink); }
.tbl th .sort-ic { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-inline-start: 3px; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: left; font-variant-numeric: tabular-nums; direction: ltr; }
.tbl tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line-strong); }
.tbl .group-row td { background: var(--surface-3); font-weight: 600; font-size: var(--fs-sm); color: var(--ink-2); padding-top: 8px; padding-bottom: 8px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; font-size: var(--fs-sm); color: var(--ink-3); border-top: 1px solid var(--line); flex-wrap: wrap; }

/* avatars */
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 0.6875rem; font-weight: 600; color: #fff; flex: 0 0 auto; letter-spacing: 0; border: 2px solid var(--surface); }
.av.lg { width: 44px; height: 44px; font-size: 0.95rem; }
.av.xl { width: 64px; height: 64px; font-size: 1.3rem; }
.av.sm { width: 22px; height: 22px; font-size: 0.625rem; border-width: 1.5px; }
.av-stack { display: inline-flex; }
.av-stack .av + .av { margin-inline-start: -8px; }

/* progress */
.prog { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; min-width: 60px; }
.prog > i { display: block; height: 100%; background: var(--navy-3); border-radius: 3px; }
.prog.ok > i { background: var(--ok); } .prog.warn > i { background: var(--warn); } .prog.bad > i { background: var(--bad); } .prog.accent > i { background: var(--accent); }
.prog.lg { height: 10px; border-radius: 5px; }

/* list rows */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li.click { cursor: pointer; }
.li.click:hover { background: var(--surface-2); }
.li .li-main { flex: 1; min-width: 0; }
.li .li-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .li-sub { font-size: var(--fs-xs); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-ic { width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); flex: 0 0 32px; }
.li-ic svg { width: 16px; height: 16px; }
.li-ic.bad { background: var(--bad-soft); color: var(--bad); } .li-ic.warn { background: var(--warn-soft); color: var(--warn); } .li-ic.ok { background: var(--ok-soft); color: var(--ok); } .li-ic.info { background: var(--info-soft); color: var(--info); } .li-ic.accent { background: var(--accent-soft); color: var(--ink); } .li-ic.violet { background: var(--violet-soft); color: var(--violet); }

/* key-value */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: var(--fs-md); }
.kv dt { color: var(--ink-3); font-size: var(--fs-sm); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* modal & drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeUp .14s ease-out; }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); width: 100%; max-width: 560px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.wide { max-width: 820px; }
.modal.narrow { max-width: 420px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: var(--fs-xl); font-family: var(--font-display); font-weight: 700; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-start; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); flex-wrap: wrap; }
.drawer-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(520px, 100vw); background: var(--surface); z-index: 81; box-shadow: var(--shadow-3); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }

/* toast */
.toasts { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 40px); }
.toast { background: var(--navy); color: var(--on-navy); padding: 11px 14px; border-radius: var(--r-md); box-shadow: var(--shadow-3); display: flex; align-items: center; gap: 10px; font-size: var(--fs-md); animation: fadeUp .18s ease-out; max-width: 420px; }
.toast svg { width: 17px; height: 17px; flex: 0 0 17px; }
.toast.ok svg { color: #7BD3A7; } .toast.bad svg { color: #FF9A92; } .toast.info svg { color: var(--accent); }

/* dropdown menu */
.menu-anchor { position: relative; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-2); z-index: 60; padding: 6px; animation: fadeUp .12s ease-out; }
.menu.right { left: auto; right: 0; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); border: 0; background: none; width: 100%; cursor: pointer; text-align: right; font-size: var(--fs-md); color: var(--ink); }
.menu-item:hover { background: var(--surface-2); }
.menu-item svg { width: 16px; height: 16px; color: var(--ink-3); flex: 0 0 16px; }
.menu-item.on { background: var(--accent-soft); }
.menu-label { font-size: var(--fs-xs); color: var(--ink-3); padding: 8px 10px 4px; font-weight: 600; }

/* empty / loading */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--ink-3); }
.empty .e-ic { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; color: var(--ink-3); margin-bottom: 4px; }
.empty .e-ic svg { width: 22px; height: 22px; }
.empty .e-title { color: var(--ink); font-weight: 600; font-size: var(--fs-lg); }
.skel { background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; border-radius: 4px; animation: pulse 1.2s ease-in-out infinite; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line-strong); border-top-color: var(--navy-3); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }

/* timeline */
.timeline { display: flex; flex-direction: column; position: relative; padding-inline-start: 22px; }
.timeline::before { content: ""; position: absolute; right: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item::before { content: ""; position: absolute; right: -20px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); }
.tl-item.done::before { background: var(--ok); border-color: var(--ok); }
.tl-item.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl-item.late::before { background: var(--bad); border-color: var(--bad); }

/* phase stepper */
.phases { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.phase { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.phase .bar { height: 6px; border-radius: 3px; background: var(--surface-3); }
.phase.done .bar { background: var(--ok); }
.phase.now .bar { background: var(--accent); }
.phase .ph-label { font-size: var(--fs-xs); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phase.now .ph-label { color: var(--ink); font-weight: 600; }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.k-col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 200px; }
.k-col.drop { border-color: var(--accent); background: var(--accent-soft); }
.k-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; font-weight: 600; font-size: var(--fs-md); }
.k-list { display: flex; flex-direction: column; gap: 8px; padding: 6px 10px 12px; }
.k-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; cursor: grab; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-1); }
.k-card:hover { border-color: var(--line-strong); }
.k-card.dragging { opacity: .5; }

/* calendar */
.cal { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-dow { background: var(--surface-2); font-size: var(--fs-xs); color: var(--ink-3); padding: 8px; text-align: center; border-bottom: 1px solid var(--line); font-weight: 600; }
.cal-cell { min-height: 108px; border-bottom: 1px solid var(--line); border-inline-start: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
.cal-cell:nth-child(7n+1) { border-inline-start: 0; }
.cal-cell.out { background: var(--surface-2); color: var(--ink-3); }
.cal-cell.weekend { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
.cal-cell .d { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
.cal-cell.today .d { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cal-ev { font-size: 0.6875rem; padding: 2px 6px; border-radius: 3px; background: var(--info-soft); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-inline-start: 2px solid var(--info); cursor: pointer; }
.cal-ev.site { background: var(--warn-soft); border-color: var(--warn); }
.cal-ev.team { background: var(--surface-3); border-color: var(--ink-3); }
.cal-ev.supplier { background: var(--violet-soft); border-color: var(--violet); }
.cal-ev.task { background: var(--accent-soft); border-color: var(--accent); }
.cal-ev.absence { background: var(--bad-soft); border-color: var(--bad); }
.cal-more { font-size: 0.6875rem; color: var(--ink-3); }
.week { display: grid; grid-template-columns: 56px repeat(5, minmax(120px, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: auto; background: var(--surface); max-height: 640px; }
.week .wk-h { position: sticky; top: 0; background: var(--surface-2); z-index: 2; padding: 8px; text-align: center; border-bottom: 1px solid var(--line); border-inline-start: 1px solid var(--line); font-size: var(--fs-sm); }
.week .wk-h.today { background: var(--accent-soft); }
.week .wk-t { font-size: 0.6875rem; color: var(--ink-3); text-align: center; height: 52px; border-bottom: 1px dashed var(--line); padding-top: 2px; font-variant-numeric: tabular-nums; }
.week .wk-col { position: relative; border-inline-start: 1px solid var(--line); }
.week .wk-slot { height: 52px; border-bottom: 1px dashed var(--line); }
.week .wk-ev { position: absolute; right: 4px; left: 4px; border-radius: 4px; padding: 4px 6px; font-size: 0.6875rem; overflow: hidden; background: var(--info-soft); border-inline-start: 3px solid var(--info); cursor: pointer; line-height: 1.3; }
.week .wk-ev.site { background: var(--warn-soft); border-color: var(--warn); }
.week .wk-ev.team { background: var(--surface-3); border-color: var(--ink-3); }
.week .wk-ev.supplier { background: var(--violet-soft); border-color: var(--violet); }

/* misc */
.swatch { width: 44px; height: 44px; border-radius: var(--r-md); flex: 0 0 44px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.swatch.lg { width: 100%; height: auto; aspect-ratio: 4/3; max-width: 100%; }
.file-ic { width: 36px; height: 44px; border-radius: 4px; display: grid; place-items: end center; padding-bottom: 5px; font-size: 9px; font-weight: 700; font-family: var(--font-mono); color: #fff; position: relative; flex: 0 0 36px; }
.file-ic::before { content: ""; position: absolute; top: 0; left: 0; width: 10px; height: 10px; background: linear-gradient(225deg, transparent 50%, rgba(255,255,255,.35) 50%); }
.code { font-family: var(--font-mono); font-size: var(--fs-xs); background: var(--surface-3); padding: 1px 6px; border-radius: 3px; color: var(--ink-2); direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.section-title { font-size: var(--fs-lg); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.locked { position: relative; }
.lock-panel { border: 1px dashed var(--line-strong); border-radius: var(--r-lg); padding: 28px; text-align: center; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 10px, var(--surface) 10px, var(--surface) 20px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lock-panel .lp-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
.lock-panel .lp-ic svg { width: 20px; height: 20px; }
.comment { display: flex; gap: 10px; }
.comment .c-bubble { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 9px 12px; flex: 1; min-width: 0; }
.comment.mine .c-bubble { background: var(--accent-soft); border-color: transparent; }
.comment.client .c-bubble { background: var(--info-soft); border-color: transparent; }
.chat { display: flex; flex-direction: column; gap: 12px; }
.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-v { position: absolute; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .axis-l { stroke: var(--line-strong); }
.steps { display: flex; gap: 0; align-items: center; margin-bottom: 24px; flex-wrap: wrap; row-gap: 8px; }
.step { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink-3); }
.step .s-n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-xs); background: var(--surface); }
.step.on { color: var(--ink); font-weight: 600; } .step.on .s-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step.done .s-n { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-line { width: 36px; height: 1px; background: var(--line-strong); margin: 0 8px; }
.price-card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 26px; }
.price-card.featured { border: 2px solid var(--navy-2); box-shadow: var(--shadow-2); }
.price-tag { font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.feat-li { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-md); }
.feat-li svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 3px; color: var(--ok); }
.feat-li.no { color: var(--ink-3); } .feat-li.no svg { color: var(--ink-3); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 8px; }
.invoice-paper { background: var(--plan-paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 36px; max-width: 760px; margin: 0 auto; box-shadow: var(--shadow-2); }
.watermark { position: relative; overflow: hidden; }
.watermark::after { content: "הדמיה · DEMO"; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg); font-size: 4rem; font-weight: 700; color: var(--bad); opacity: 0.08; pointer-events: none; white-space: nowrap; font-family: var(--font-display); }
.article { max-width: 72ch; font-size: var(--fs-lg); line-height: 1.75; }
.article p + p { margin-top: 12px; }
.article h3 { margin: 20px 0 8px; font-size: var(--fs-xl); }
.meter-label { display: flex; justify-content: space-between; font-size: var(--fs-sm); margin-bottom: 5px; gap: 8px; }

/* plan viewer workspace */
.pv { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .pv { grid-template-columns: minmax(0, 1fr); } }
.pv-stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pv-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.tool { height: 32px; min-width: 32px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-md); border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); font-size: var(--fs-sm); }
.tool svg { width: 16px; height: 16px; }
.tool:hover { background: var(--surface); border-color: var(--line); }
.tool.on { background: var(--navy-2); color: var(--on-navy); }
.tool-sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 4px; }
.pv-canvas { position: relative; overflow: hidden; background: var(--surface-3); min-height: 420px; touch-action: none; }
.pv-canvas.mode-pan { cursor: grab; }
.pv-canvas.mode-pan.dragging { cursor: grabbing; }
.pv-canvas.mode-add { cursor: crosshair; }
.pv-inner { transform-origin: 50% 50%; transition: transform .12s ease-out; padding: 16px; }
.pv-inner.dragging { transition: none; }
.pv-inner svg { box-shadow: var(--shadow-2); border-radius: 2px; }
.pv-status { display: flex; gap: 12px; align-items: center; padding: 6px 12px; font-size: var(--fs-xs); color: var(--ink-3); border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.pin { cursor: pointer; }
.pin circle.halo { opacity: 0; transition: opacity .15s; }
.pin:hover circle.halo, .pin.sel circle.halo { opacity: 0.25; }
.processing-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 70%, transparent); z-index: 2; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 800px) { .compare { grid-template-columns: minmax(0, 1fr); } }
.overlay-stack { position: relative; }
.overlay-stack > div + div { position: absolute; inset: 0; }
.plan-thumb { position: relative; aspect-ratio: 1000 / 720; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--plan-paper); border-radius: var(--r-lg) var(--r-lg) 0 0; max-width: 100%; }
.plan-thumb .pt-badges { position: absolute; top: 8px; inset-inline-start: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.dropzone { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 28px; text-align: center; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.dropzone:hover, .dropzone.over { border-color: var(--blueprint); background: var(--blueprint-faint); }
.dropzone svg { width: 28px; height: 28px; color: var(--ink-3); }

/* ArchiFlow – visual refinement layer.
   One bold element per screen (the navy "title block" hero on the dashboard and project page);
   everything around it is quiet: soft depth, consistent radii, calm hover states. */

/* ---------- surfaces ---------- */
.card { border-color: var(--line); box-shadow: var(--shadow-1); }
.card.link { transition: border-color .16s var(--ease), box-shadow .16s var(--ease), transform .16s var(--ease); }
.card.link:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-2); }
.card.link:active { transform: translateY(0); }
.card-head { padding: 15px 20px; border-bottom-color: color-mix(in srgb, var(--line) 70%, transparent); }
.card-head h2, .card-head h3 { font-size: 0.97rem; letter-spacing: -0.005em; }
.card-head h2 svg, .card-head h3 svg { color: var(--blueprint); }
.card-body { padding: 18px 20px; }
.li { padding: 12px 20px; transition: background .12s; }

/* ---------- page entrance (once per screen) ---------- */
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* opacity only: a transform here would trap the page's fixed-position modals inside the content area */
@keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }
.content > * { animation: pageFade .28s var(--ease); }

/* ---------- page header ---------- */
.page-head { margin-bottom: 24px; }
.page-head h1 { font-size: clamp(1.7rem, 1.2rem + 1.4vw, 2.35rem); letter-spacing: -0.015em; }
.page-head .ph-sub { font-size: 0.95rem; }

/* ---------- buttons ---------- */
.btn { height: 38px; border-color: var(--line-strong); box-shadow: var(--shadow-1); transition: background .14s, border-color .14s, box-shadow .14s, transform .08s; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 2px 6px -1px color-mix(in srgb, var(--accent) 55%, transparent); }
.btn.primary:hover { box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 6px 16px -4px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.ghost, .btn.ghost:hover { box-shadow: none; }
.btn.sm { height: 32px; } .btn.xs { height: 26px; box-shadow: none; } .btn.lg { height: 46px; }
.icon-btn { border-radius: 10px; }

/* ---------- stats ---------- */
.stat { padding: 18px 20px; gap: 8px; overflow: hidden; }
.stat::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--line); opacity: 0; transition: opacity .16s; }
.stat.link:hover::before { opacity: 1; background: var(--accent); }
.stat.alert::before { opacity: 1; background: var(--bad); }
.stat.warn::before { opacity: 1; background: var(--warn); }
.stat .s-label { font-weight: 500; }
.stat .s-label svg { width: 28px; height: 28px; padding: 6px; border-radius: 9px; background: var(--surface-3); color: var(--ink-2); flex: 0 0 28px; }
.stat.alert .s-label svg { background: var(--bad-soft); color: var(--bad); }
.stat.warn .s-label svg { background: var(--warn-soft); color: var(--warn); }
.stat .s-value { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.025em; }

/* ---------- badges & project status colors ---------- */
.badge { height: 23px; padding: 0 9px; font-weight: 500; }
.badge.st { background: color-mix(in srgb, var(--c) 13%, transparent); color: color-mix(in srgb, var(--c) 82%, var(--ink)); }
.badge.st .bd { background: var(--c); }

/* ---------- sidebar ---------- */
.sb-brand { padding: 20px 18px 16px; }
.sb-office { border-radius: 12px; background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); border-color: rgba(169,179,201,0.18); }
.sb-group { margin-top: 18px; }
.sb-item { padding: 8px 12px; border-radius: 10px; transition: background .12s, color .12s; }
.sb-item svg { opacity: .85; }
.sb-item.active { background: linear-gradient(270deg, rgba(var(--accent-rgb),0.20), rgba(var(--accent-rgb),0.06)); color: #fff; font-weight: 500; }
.sb-item.active svg { color: var(--accent-bright); opacity: 1; }
.sb-item.active::before { right: -10px; top: 8px; bottom: 8px; border-radius: 3px 0 0 3px; }

/* ---------- top bar ---------- */
.topbar { height: 64px; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); }
.search input { height: 40px; border-radius: 12px; background: var(--surface-2); border-color: transparent; transition: background .14s, border-color .14s, box-shadow .14s; }
.search input:hover { border-color: var(--line); }
.search input:focus { border-color: var(--accent-strong); box-shadow: 0 0 0 4px var(--blueprint-faint); }
.search > svg { top: 12px; }
.search kbd { top: 10px; }
.search-results { border-radius: 14px; box-shadow: var(--shadow-3); top: 48px; }
.role-pill { border-radius: 24px; transition: border-color .12s, box-shadow .12s; }
.role-pill:hover { box-shadow: var(--shadow-1); }

/* ---------- filters / chips / tabs ---------- */
.chip { height: 32px; padding: 0 13px; border-radius: 16px; transition: background .12s, border-color .12s, color .12s; }
.chip.on { box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--navy-2) 60%, transparent); }
.btn-group { border-radius: 10px; box-shadow: var(--shadow-1); }
.btn-group button { height: 36px; }
.tabs { gap: 4px; }
.tab { padding: 11px 14px; border-bottom-width: 3px; transition: color .12s; }
.tab.on { border-bottom-color: var(--accent); }
.input, .select, .textarea { height: 40px; border-radius: 10px; transition: border-color .14s, box-shadow .14s; }
.textarea { height: auto; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus { box-shadow: 0 0 0 4px var(--blueprint-faint); }
.filters .select, .filters .search-in input { height: 38px; }

/* ---------- tables ---------- */
.tbl th { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); padding: 11px 16px; }
.tbl td { padding: 12px 16px; border-bottom-color: color-mix(in srgb, var(--line) 75%, transparent); }
.tbl tbody tr.click td { transition: background .1s; }
.tbl tbody tr.click:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.card > .table-wrap:first-child .tbl th:first-child { border-start-start-radius: var(--r-lg); }

/* ---------- modal / drawer / menus / toasts (motion answers the user's action) ---------- */
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { transform: translateX(-24px); opacity: .6; } to { transform: none; opacity: 1; } }
.scrim { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal { border-radius: var(--r-xl); animation: popIn .2s var(--ease); }
.modal-foot { border-radius: 0 0 var(--r-xl) var(--r-xl); }
.drawer { animation: slideIn .22s var(--ease); border-radius: 0 var(--r-xl) var(--r-xl) 0; }
.menu { border-radius: 14px; box-shadow: var(--shadow-3); }
.toast { border-radius: 12px; padding: 12px 16px; }

/* ---------- progress ---------- */
.prog { height: 7px; border-radius: 4px; }
.prog > i { border-radius: 4px; transition: width .5s var(--ease); }

/* ---------- kanban ---------- */
.k-col { border-radius: 16px; background: color-mix(in srgb, var(--surface-2) 80%, var(--bg)); }
.k-card { border-radius: 12px; transition: box-shadow .14s, border-color .14s, transform .14s; }
.k-card:hover { box-shadow: var(--shadow-2); }

/* ---------- project cards ---------- */
.pcard { overflow: hidden; }
.pcard .pc-cover { position: relative; }
.pcard .pc-cover::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(to top, color-mix(in srgb, var(--surface) 92%, transparent), transparent); pointer-events: none; }
.pcard:hover .pc-cover > div { transform: scale(1.03); }
.pcard .pc-cover > div { transition: transform .5s var(--ease); }
.pcard .pc-status { position: absolute; bottom: 10px; inset-inline-start: 12px; z-index: 1; box-shadow: var(--shadow-1); background: var(--surface); }

/* ---------- title block hero (the one bold element) ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-xl); color: var(--on-navy);
  background-color: var(--navy);
  background-image:
    radial-gradient(120% 140% at 0% 0%, rgba(var(--accent-rgb),0.16), transparent 46%),
    linear-gradient(var(--blueprint-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--blueprint-faint) 1px, transparent 1px);
  background-size: auto, 26px 26px, 26px 26px;
  box-shadow: var(--shadow-2);
}
.hero h1, .hero h2 { color: #fff; }
.hero .muted, .hero .ph-sub { color: var(--on-navy-2); }
.hero-in { position: relative; z-index: 1; padding: 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 28px; align-items: end; }
.hero-date { font-size: var(--fs-sm); color: var(--on-navy-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hero-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 1.3rem + 1.8vw, 2.8rem); line-height: 1.08; letter-spacing: -0.02em; margin-top: 8px; }
.hero-sub { color: var(--on-navy-2); margin-top: 8px; max-width: 60ch; font-size: 0.97rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: 460px; }
.hero .btn { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.16); color: var(--on-navy); box-shadow: none; }
.hero .btn:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.3); }
.hero .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hero .tag-demo { background: rgba(229,168,70,0.12); border-color: rgba(229,168,70,0.6); color: #F2C77A; }
/* drawing title-block strip along the bottom edge of the hero */
.hero-strip { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border-top: 1px solid rgba(169,179,201,0.22); }
.hero-cell { padding: 12px 20px; border-inline-start: 1px solid rgba(169,179,201,0.22); background: none; border-top: 0; border-bottom: 0; border-inline-end: 0; color: inherit; text-align: right; cursor: pointer; transition: background .14s; font: inherit; }
.hero-cell:first-child { border-inline-start: 0; }
.hero-cell:hover { background: rgba(255,255,255,0.05); }
.hero-cell .hc-k { font-size: var(--fs-xs); color: var(--on-navy-2); display: flex; align-items: center; gap: 6px; }
.hero-cell .hc-k svg { width: 14px; height: 14px; }
.hero-cell .hc-v { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: #fff; line-height: 1.2; margin-top: 2px; }
.hero-cell .hc-m { font-size: var(--fs-xs); color: var(--on-navy-2); }
.hero-cell.bad .hc-v { color: #FF9A92; } .hero-cell.warn .hc-v { color: #F5C866; }
@media (max-width: 860px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); padding: 22px 20px; }
  .hero-actions { justify-content: flex-start; max-width: none; }
  .hero-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-cell { border-top: 1px solid rgba(169,179,201,0.22); }
  .hero-cell:nth-child(odd) { border-inline-start: 0; }
  .hero-strip .hero-cell:nth-child(-n+2) { border-top: 0; }
}

/* ---------- auth / public ---------- */
.auth-card { animation: pageIn .4s var(--ease) both; }
.auth-art { background-image: radial-gradient(90% 80% at 100% 100%, rgba(var(--accent-rgb),0.14), transparent 60%); }

/* ---------- portal ---------- */
.portal-hero { border-radius: var(--r-xl); box-shadow: var(--shadow-2); }
.portal-nav button { border-bottom-width: 3px; }

/* ---------- scrollbars ---------- */
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

@media (prefers-reduced-motion: reduce) { .card.link:hover, .pcard:hover .pc-cover > div { transform: none; } }
@media (max-width: 860px) { .hero-strip .hero-cell:last-child:nth-child(odd) { grid-column: 1 / -1; } }

/* project header: the drawing of the project sits behind the title, fading out toward the text */
.page-head-art { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px 24px; box-shadow: var(--shadow-1); overflow: hidden; align-items: center; }
.page-head-art > :not(.ph-art) { position: relative; z-index: 1; }
.ph-art { position: absolute; inset: -30% auto -30% 0; width: 50%; opacity: .32; pointer-events: none;
  -webkit-mask-image: linear-gradient(to left, transparent, #000 55%); mask-image: linear-gradient(to left, transparent, #000 55%); }
.ph-art svg { width: 100%; height: auto; }
@media (max-width: 760px) { .ph-art { width: 100%; opacity: .14; } .page-head-art { padding: 18px; } }
:root[data-theme="dark"] .hero { border: 1px solid var(--line); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { border: 1px solid var(--line); } }
.auth-wrap { align-items: start; }
.auth-art { position: sticky; top: 0; height: 100vh; height: 100dvh; }

/* ---------- command palette ---------- */
.search-trigger { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; color: var(--ink-3); cursor: pointer; text-align: right; font: inherit; transition: border-color .14s, background .14s; }
.search-trigger:hover { border-color: var(--line-strong); background: var(--surface); }
.search-trigger > svg { position: static; width: 16px; height: 16px; flex: 0 0 16px; }
.search-trigger .st-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-md); }
.search-trigger kbd { position: static; font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface); color: var(--ink-3); }
@media (max-width: 640px) { .search-trigger { flex: 0 0 40px; width: 40px; padding: 0; justify-content: center; } .search-trigger .st-text, .search-trigger kbd { display: none; } }
.palette-scrim { align-items: flex-start; padding-top: min(14vh, 120px); }
.palette { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-3); overflow: hidden; display: flex; flex-direction: column; max-height: min(72vh, 620px); animation: popIn .18s var(--ease); }
.pal-input { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.pal-input svg { width: 19px; height: 19px; color: var(--blueprint); flex: 0 0 19px; }
.pal-input input { flex: 1; height: 58px; border: 0; background: none; outline: none; font-size: 1.05rem; color: var(--ink); min-width: 0; }
.pal-input kbd, .pal-foot kbd, .pal-kbd, .shortcuts kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.pal-list { overflow-y: auto; padding: 6px 8px 10px; flex: 1; }
.pal-list .sr-item { padding: 9px 12px; border-radius: 10px; gap: 12px; font-size: var(--fs-md); color: var(--ink); }
.pal-list .sr-item svg { width: 17px; height: 17px; flex: 0 0 17px; }
.pal-list .sr-item.on { background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface)); }
.pal-list .sr-item.on > svg:first-child { color: var(--ink); }
.pal-enter { color: var(--ink-3); }
.pal-list .sr-group { padding: 12px 12px 4px; }
.pal-empty { padding: 28px 18px; text-align: center; color: var(--ink-3); }
.pal-foot { display: flex; gap: 16px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: var(--fs-xs); color: var(--ink-3); flex-wrap: wrap; }
.pal-foot kbd { margin-inline-end: 3px; }
.pal-foot .linkish { margin-inline-start: auto; font-size: var(--fs-xs); }
.shortcuts { grid-template-columns: 90px minmax(0, 1fr); align-items: center; gap: 10px 16px; }
@media (max-width: 640px) { .palette-scrim { padding: 0; align-items: stretch; } .palette { max-width: none; max-height: none; border-radius: 0; height: 100dvh; } .pal-foot { display: none; } }
.toast-undo { display: inline-flex; align-items: center; gap: 5px; margin-inline-start: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #fff; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
.toast-undo:hover { background: rgba(255,255,255,0.18); }
.toast-undo svg { width: 14px; height: 14px; }

/* ---------- drag and drop ---------- */
.k-card { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.k-card.dragging { opacity: .35; }
.drag-ghost { position: fixed; z-index: 200; pointer-events: none; margin: 0; transform: rotate(-2deg) scale(1.02); box-shadow: var(--shadow-3) !important; opacity: .96; cursor: grabbing; }
body.dragging-now, body.dragging-now * { cursor: grabbing !important; user-select: none; }
.k-col { transition: background .14s, border-color .14s, box-shadow .14s; }
.k-col.drop { box-shadow: inset 0 0 0 2px var(--accent); }
.k-empty { padding: 18px; border: 1.5px dashed var(--line-strong); border-radius: 10px; }
.project-board { grid-auto-columns: minmax(236px, 1fr); }
.inline-edit { position: relative; cursor: pointer; padding-inline-end: 6px; transition: box-shadow .12s; }
.inline-edit:hover, .inline-edit:focus-within { box-shadow: 0 0 0 1px var(--line-strong); }
.inline-edit:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.inline-edit select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; font-size: 16px; }
.inline-edit .ie-caret { width: 11px; height: 11px; opacity: .55; }
.camera-only { display: none; }
@media (pointer: coarse) { .camera-only { display: inline-flex; align-self: flex-start; } }

/* ---------- mobile tab bar (app-like navigation on phones) ---------- */
.tabbar { display: none; }
@media (max-width: 760px) {
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0 0; z-index: 45; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-right, 0px)); }
  .tb-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--ink-3); font-size: 0.6875rem; font-weight: 500; padding: 4px 0; cursor: pointer; min-height: 48px; border-radius: 12px; -webkit-tap-highlight-color: transparent; }
  .tb-item svg { width: 22px; height: 22px; }
  .tb-item.on { color: var(--ink); }
  .tb-item.on svg { color: var(--ink); stroke-width: 2.4; }
  .tb-new .tb-plus { width: 48px; height: 48px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 16px -4px color-mix(in srgb, var(--accent) 70%, transparent); margin-top: -18px; }
  .tb-new .tb-plus svg { width: 24px; height: 24px; stroke-width: 2.5; color: var(--accent-ink); }
  .shell .content { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .shell:has(> .tabbar) .toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .tb-actions .btn.primary { display: none; }
}

/* ---------- phones: data tables become stacked cards, filter chips scroll sideways ---------- */
@media (max-width: 640px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; }
  .tbl-stack thead { display: none; }
  .tbl-stack, .tbl-stack tbody, .tbl-stack tr, .tbl-stack td { display: block; width: 100%; }
  .tbl-stack tbody tr { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 14px; }
  .tbl-stack tbody tr:last-child { border-bottom: 0; }
  .tbl-stack td { padding: 0; border: 0; min-width: 0; }
  .tbl-stack td[data-label]:not([data-label=""])::before { content: attr(data-label); display: block; font-size: 0.6875rem; color: var(--ink-3); font-weight: 600; margin-bottom: 1px; }
  .tbl-stack td.td-first, .tbl-stack td.td-nolabel + td { grid-column: 1 / -1; }
  .tbl-stack td.td-first.td-nolabel { grid-column: auto; position: absolute; }
  .tbl-stack tbody tr { position: relative; }
  .tbl-stack td.td-nolabel.td-first + td { padding-inline-start: 30px; }
  .tbl-stack td.num { text-align: right; direction: rtl; }
  .tbl-stack tr.group-row, .tbl-stack tr.group-row td { display: block; grid-column: 1 / -1; }
  .tbl-stack tbody tr.click:hover td { background: none; }
  .tbl-stack tfoot { display: block; } .tbl-stack tfoot tr { display: flex; justify-content: space-between; } .tbl-stack tfoot td { width: auto; }
}
@media (max-width: 640px) {
  .grid-4:has(> .stat), .grid-3:has(> .stat) { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px; }
  .stat { padding: 14px; } .stat .s-value { font-size: 1.45rem; } .stat .s-label { font-size: var(--fs-xs); }
}

/* ---------- project timeline ---------- */
.ptl { --name-w: 190px; position: relative; }
.ptl-axis { position: relative; height: 22px; margin-inline-start: var(--name-w); font-size: 0.6875rem; color: var(--ink-3); }
.ptl-month { position: absolute; top: 0; transform: translateX(50%); white-space: nowrap; padding-inline-start: 4px; }
.ptl-month b { font-weight: 600; color: var(--ink-2); }
.ptl-body { position: relative; }
.ptl-layer { position: absolute; top: 0; bottom: 0; inset-inline-start: var(--name-w); inset-inline-end: 0; pointer-events: none; z-index: 2; }
.ptl-gl { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--line) 80%, transparent); transform: translateX(50%); }
.ptl-today { position: absolute; top: -4px; bottom: 0; width: 2px; background: var(--accent); transform: translateX(50%); }
.ptl-today span { position: absolute; top: -20px; inset-inline-start: 50%; transform: translateX(50%); font-size: 0.6875rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 0 6px; border-radius: 6px; white-space: nowrap; }
.ptl-axis { margin-bottom: 18px; }
.ptl-row { display: flex; align-items: center; width: 100%; height: 36px; background: none; border: 0; padding: 0; cursor: pointer; text-align: right; font: inherit; color: inherit; border-radius: 8px; }
.ptl-row:hover { background: var(--surface-2); }
.ptl-row:hover .ptl-bar { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }
.ptl-name { flex: 0 0 var(--name-w); width: var(--name-w); padding-inline: 4px 12px; font-size: var(--fs-sm); font-weight: 500; }
.ptl-track { position: relative; flex: 1; height: 100%; z-index: 1; }
.ptl-bar { position: absolute; top: 10px; height: 16px; border-radius: 6px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); transition: box-shadow .14s; }
.ptl-bar.late { border-color: var(--bad); border-style: dashed; }
.ptl-fill { position: absolute; inset-block: -1px; inset-inline-start: -1px; background: var(--c); opacity: .9; border-radius: 6px; }
.ptl-pct { position: absolute; inset-inline-start: calc(100% + 6px); top: -1px; font-size: 0.6875rem; font-weight: 600; line-height: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 760px) { .ptl { --name-w: 112px; } .ptl-name { font-size: var(--fs-xs); } }

/* ---------- landing after an e-mail link ---------- */
.verified-badge { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.verified-badge svg { width: 30px; height: 30px; }
.next-steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.next-steps li { counter-increment: s; display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.next-steps li::before { content: counter(s); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm); }
.next-steps li:first-child { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 3px var(--accent-soft); }
.next-steps li:first-child::before { background: var(--accent); color: var(--accent-ink); }
.next-steps b { font-weight: 600; }
.next-steps span { color: var(--ink-2); font-size: var(--fs-sm); }

/* ---------- touch targets: every tappable thing is at least 28px tall on phones (WCAG 2.5.8 asks for 24) ---------- */
@media (max-width: 760px), (pointer: coarse) {
  button.linkish, .crumbs button, button.badge, .cal-ev, .ptl-row, .sr-item { min-height: 28px; }
  button.linkish { display: inline-flex; align-items: center; padding-block: 4px; }
  button.badge { padding-block: 4px; height: auto; }
  .btn { min-height: 40px; } .btn.sm { min-height: 34px; } .btn.xs { min-height: 30px; }
  .icon-btn { width: 40px; height: 40px; }
  .input, .select, .textarea { font-size: 16px; } /* 16px stops phones from zooming into fields */
}

/* ---------- accessibility menu ---------- */
.a11y { position: relative; }
.a11y .icon-btn.a11y-active, .a11y-fab.a11y-active { color: var(--accent-strong); box-shadow: inset 0 0 0 2px var(--accent-strong); }
.a11y-floating { position: fixed; z-index: 70; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: calc(18px + env(safe-area-inset-left, 0px)); }
.a11y-fab { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-2); }
.a11y-fab svg { width: 24px; height: 24px; }
.a11y-panel { position: absolute; top: calc(100% + 8px); left: 0; width: min(330px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-3); padding: 14px; z-index: 90; display: flex; flex-direction: column; gap: 14px; animation: popIn .16s var(--ease); }
.a11y-floating .a11y-panel { top: auto; bottom: calc(100% + 10px); }
.a11y-head { display: flex; align-items: center; justify-content: space-between; }
.a11y-head b { font-size: var(--fs-lg); }
.a11y-size { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.a11y-steps { display: flex; gap: 6px; }
.a11y-step { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 700; display: grid; place-items: center; }
.a11y-step.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.a11y-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.a11y-opt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); cursor: pointer; font: inherit; font-size: var(--fs-sm); font-weight: 500; text-align: center; }
.a11y-opt svg { width: 22px; height: 22px; color: var(--ink-2); }
.a11y-opt.on { background: var(--accent-soft); border-color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent-strong); }
.a11y-opt.on svg { color: var(--accent-strong); }
.a11y-foot { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 760px) { .shell .a11y-floating { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

/* the settings themselves */
html[data-text-size="1"] { font-size: 112.5%; }
html[data-text-size="2"] { font-size: 125%; }
html[data-text-size="3"] { font-size: 140%; }
html[data-links] a, html[data-links] .linkish, html[data-links] .crumbs button { text-decoration: underline !important; text-underline-offset: 3px; font-weight: 600; }
html[data-plain] { --font-display: Arial, "Assistant", "Segoe UI", sans-serif; --font-body: Arial, "Assistant", "Segoe UI", sans-serif; }
html[data-plain] body { letter-spacing: 0.01em; word-spacing: 0.06em; }
html[data-still] *, html[data-still] *::before, html[data-still] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
html[data-hc] {
  --bg: #FFFFFF; --paper: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2; --surface-3: #E6E6E6;
  --line: #6B6B6B; --line-strong: #2B2B2B; --ink: #000000; --ink-2: #111111; --ink-3: #222222;
  --navy: #000000; --navy-2: #000000; --navy-3: #1A1A1A; --on-navy: #FFFFFF; --on-navy-2: #F0F0F0;
  --accent: #005A50; --accent-hover: #00433B; --accent-bright: #7FF0E2; --accent-ink: #FFFFFF; --accent-soft: #D2F5F0;
  --ok: #0B5A36; --warn: #6B3F00; --bad: #8A1414; --info: #12407A; --violet: #4A2780;
  --shadow-1: none; --shadow-2: none; --shadow-3: 0 0 0 2px #000;
}
html[data-hc] .card, html[data-hc] .btn, html[data-hc] .input, html[data-hc] .select, html[data-hc] .textarea, html[data-hc] .badge, html[data-hc] .chip { border-width: 1.5px; border-color: var(--line-strong); }
html[data-hc] :focus-visible { outline: 3px solid #000 !important; outline-offset: 3px; box-shadow: 0 0 0 6px #FFD400 !important; }
html[data-hc] .sidebar, html[data-hc] .hero { background-image: none !important; }
.reading-guide { position: fixed; inset: 0 0 auto 0; top: -22px; height: 44px; z-index: 300; pointer-events: none; background: rgba(var(--accent-rgb), 0.08); border-block: 2px solid var(--accent); }

/* ---------- skip link ---------- */
.skip-link { position: fixed; top: 8px; right: 8px; z-index: 400; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; transform: translateY(-150%); transition: transform .15s; }
.skip-link:focus { transform: none; }

/* ---------- accessibility statement ---------- */
.statement { max-width: 760px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 120px; display: flex; flex-direction: column; gap: 14px; font-size: var(--fs-lg); line-height: 1.75; }
.statement-head { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.statement-head h1 { font-size: var(--fs-3xl); line-height: 1.15; }
.statement-ic { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; flex: 0 0 56px; }
.statement-ic svg { width: 28px; height: 28px; }
.statement h2 { font-size: var(--fs-xl); margin-top: 18px; }
.statement-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.statement-list li { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.statement-list svg { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 5px; color: var(--accent-strong); }
.statement-contact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.a11y-grid .a11y-opt:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 56px; flex-direction: row; }

/* ArchiFlow – color and motion layer: the peach → pink → lilac gradient, a living banner,
   staggered entrances, filling bars and a little celebration. Everything here is switched off by
   prefers-reduced-motion and by "עצירת אנימציות" in the accessibility menu (html[data-still]). */

/* ---------- ambience ---------- */
body { background:
  radial-gradient(900px 520px at 100% -10%, rgba(var(--accent-rgb), 0.16), transparent 60%),
  radial-gradient(700px 480px at -10% 110%, rgba(217, 165, 201, 0.14), transparent 60%),
  var(--bg); background-attachment: fixed; }

/* ---------- sidebar: deep plum with a soft vertical sheen ---------- */
.sidebar { background-image:
  linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.12)),
  linear-gradient(var(--blueprint-faint) 1px, transparent 1px),
  linear-gradient(90deg, var(--blueprint-faint) 1px, transparent 1px); background-size: auto, 24px 24px, 24px 24px; }
.sb-item svg { transition: transform .2s var(--ease); }
.sb-item:hover svg { transform: translateX(-2px) scale(1.06); }
.sb-item.active { background: linear-gradient(270deg, rgba(var(--accent-rgb), 0.30), rgba(var(--accent-rgb), 0.06)); }
.sb-item.active::before { background: var(--grad) !important; width: 4px; }
.sb-name span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent !important; }

/* ---------- primary buttons: gradient with a shine sweep on hover ---------- */
.btn.primary, .hero .btn.primary { background: var(--grad) !important; background-size: 170% 100% !important; background-position: 100% 0 !important; border-color: transparent !important; color: var(--accent-ink) !important; position: relative; overflow: hidden; transition: background-position .6s var(--ease), box-shadow .2s, transform .08s; }
.btn.primary:hover, .hero .btn.primary:hover { background-position: 0 0 !important; box-shadow: 0 8px 22px -8px rgba(var(--accent-rgb), 0.9); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; inset-inline-start: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent); transform: skewX(-18deg); pointer-events: none; }
.btn.primary:hover::after { animation: shine .8s var(--ease); }
@keyframes shine { to { inset-inline-start: 130%; } }
.tb-new .tb-plus { background: var(--grad) !important; }

/* ---------- the banner: an aurora drifting behind the greeting ---------- */
.hero { isolation: isolate; }
.hero::before, .hero::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; filter: blur(46px); opacity: .55; pointer-events: none; }
.hero::before { width: 420px; height: 420px; top: -180px; left: -80px; background: radial-gradient(circle, #EFB0A1, transparent 65%); animation: drift1 16s ease-in-out infinite alternate; }
.hero::after { width: 380px; height: 380px; bottom: -220px; left: 30%; background: radial-gradient(circle, #D9A5C9, transparent 65%); animation: drift2 19s ease-in-out infinite alternate; }
@keyframes drift1 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(140px, 60px) scale(1.15); } 100% { transform: translate(60px, 120px) scale(.95); } }
@keyframes drift2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-160px, -50px) scale(1.2); } 100% { transform: translate(80px, -90px) scale(1); } }
.hero-title { background: linear-gradient(90deg, #FFFFFF 30%, #FBD9D2 70%, #F4C6DA); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
.hero-cell .hc-v { font-variant-numeric: tabular-nums; }
.hero-cell { transition: background .2s, transform .2s var(--ease); }
.hero-cell:hover { background: rgba(255,255,255,0.07); }
.hero-cell:hover .hc-v { transform: translateY(-1px); }
.hero-cell .hc-v { display: inline-block; transition: transform .2s var(--ease); }

/* the same aurora on the sign-in art panel */
.auth-art { isolation: isolate; }
.auth-art::before, .auth-art::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; filter: blur(60px); opacity: .45; pointer-events: none; }
.auth-art::before { width: 520px; height: 520px; bottom: -160px; right: -120px; background: radial-gradient(circle, #EFB0A1, transparent 65%); animation: drift2 22s ease-in-out infinite alternate; }
.auth-art::after { width: 460px; height: 460px; top: 10%; left: -160px; background: radial-gradient(circle, #D9A5C9, transparent 65%); animation: drift1 18s ease-in-out infinite alternate; }
.auth-art > * { z-index: 1; }

/* ---------- entrances: cards rise in one after another (fill "backwards" leaves no transform behind) ---------- */
@keyframes riseIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.content .hero, .content .page-head,
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .grid-main-side, .grid-rail, .kanban) > :is(.card, section, article, .k-col, .stat) { animation: riseIn .55s var(--ease) backwards; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(2) { animation-delay: .05s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(3) { animation-delay: .1s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(4) { animation-delay: .15s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(5) { animation-delay: .2s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(6) { animation-delay: .25s; }
.content :is(.grid-2, .grid-3, .grid-4, .grid-auto, .stack-lg, .stack, .kanban) > :nth-child(n+7) { animation-delay: .3s; }
.content .li { animation: fadeIn .4s var(--ease) backwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- cards: soft rosy glow on hover ---------- */
.card.link:hover { box-shadow: 0 16px 34px -16px rgba(var(--accent-rgb), 0.75), var(--shadow-1); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.pcard .pc-status { backdrop-filter: blur(6px); }

/* ---------- bars fill in ---------- */
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.prog > i { transform-origin: right center; animation: growX 1s var(--ease) backwards .15s; }
.prog.accent > i { background: var(--grad); }
.ptl-bar { transform-origin: right center; animation: growX .9s var(--ease) backwards; }
.ptl-row:nth-child(2) .ptl-bar { animation-delay: .06s; } .ptl-row:nth-child(3) .ptl-bar { animation-delay: .12s; } .ptl-row:nth-child(4) .ptl-bar { animation-delay: .18s; }
.ptl-row:nth-child(5) .ptl-bar { animation-delay: .24s; } .ptl-row:nth-child(n+6) .ptl-bar { animation-delay: .3s; }
.ptl-today { animation: fadeIn .6s ease .7s backwards; }
.ptl-today span { background: var(--grad); }

/* ---------- small delights ---------- */
.tab.on { border-image: var(--grad) 1; border-bottom-width: 3px; }
.chip.on { background: var(--navy); }
.badge.st .bd { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.k-card:hover, .k-card:focus-visible { transform: translateY(-2px); }
.toast { animation: toastIn .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
.verified-badge { animation: pop .6s cubic-bezier(.2, 1.5, .4, 1) .1s backwards; background: var(--grad) !important; color: var(--accent-ink) !important; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.empty .e-ic { background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, #D9A5C9 22%, var(--surface))); color: var(--accent-strong); }

/* confetti pieces (created by src/ui/confetti.ts) */
.confetti-piece { position: fixed; z-index: 500; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; will-change: transform, opacity; }

/* ---------- respect people who prefer less motion ---------- */
@media (prefers-reduced-motion: reduce) { .hero::before, .hero::after, .auth-art::before, .auth-art::after { animation: none; } }
html[data-still] .hero::before, html[data-still] .hero::after, html[data-still] .auth-art::before, html[data-still] .auth-art::after { animation: none !important; }
html[data-hc] .hero::before, html[data-hc] .hero::after, html[data-hc] .auth-art::before, html[data-hc] .auth-art::after { display: none; }
html[data-hc] .hero-title, html[data-hc] .sb-name span { background: none; color: inherit !important; }
html[data-hc] .btn.primary { background: #000 !important; color: #fff !important; }

/* ---------- invitation to the demo (live sign-in) and back to the real site (demo strip) ---------- */
.demo-cta { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; text-decoration: none; color: var(--ink); background: linear-gradient(120deg, color-mix(in srgb, #EFB0A1 22%, var(--surface)), color-mix(in srgb, #D9A5C9 20%, var(--surface))); border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); transition: transform .2s var(--ease), box-shadow .2s; }
.demo-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -14px rgba(var(--accent-rgb), .9); }
.demo-cta .grow { display: flex; flex-direction: column; }
.demo-cta-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; flex: 0 0 40px; color: var(--accent-ink); }
.demo-cta-ic svg { width: 20px; height: 20px; }
.demo-cta > svg { width: 18px; height: 18px; color: var(--accent-strong); }
.demo-strip-cta { margin-inline-start: auto; font-weight: 700; color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; }
