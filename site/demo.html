tus:"טיוטה"},{id:"rp3",dataType:"יומן ביקורת (Audit log)",period:"7 שנים",action:"ארכוב",status:"טיוטה"},{id:"rp4",dataType:"חשבוניות ונתוני חיוב",period:"7 שנים",action:"שמירה (דרישה חשבונאית משוערת)",status:"טיוטה"},{id:"rp5",dataType:"פניות תמיכה",period:"24 חודשים",action:"אנונימיזציה",status:"טיוטה"},{id:"rp6",dataType:"משתמשי לקוח לא פעילים",period:"12 חודשים ללא כניסה",action:"השבתת גישה לפורטל",status:"טיוטה"}],io=[{id:"h1",category:"צעדים ראשונים",title:"הקמת משרד והזמנת הצוות",minutes:3,body:["לאחר ההרשמה, אשף ההקמה מבקש את פרטי המשרד, תחומי ההתמחות ותבנית הפרויקט המועדפת.",'מתוך "צוות והרשאות" לוחצים על "הזמנת חבר צוות", בוחרים תפקיד ושולחים. עד שההזמנה מתקבלת היא מופיעה כ"ממתינה".','בדמו, ההזמנות לא נשלחות בפועל ומופיעות ביומן המיילים כ"הודמה – לא נשלח".']},{id:"h2",category:"פרויקטים",title:"סטטוסים של פרויקט ומתי להחליף אותם",minutes:4,body:["לכל פרויקט יש אחד מתשעה סטטוסים: ליד חדש, תכנון ראשוני, תכנון בפיתוח, ממתין לאישור, תכנון מאושר, ביצוע, לקראת מסירה, הושלם, בהשהיה.",'המערכת לעולם לא משנה סטטוס לבד. כששולחים פריט לאישור לקוח, היא רק מציעה לעבור ל"ממתין לאישור" – וההחלטה שלכם.']},{id:"h3",category:"שרטוטים",title:"אילו קבצים אפשר להעלות?",minutes:2,body:["ניתן לשמור PDF, JPG, PNG, DWG ו-DXF. תצוגה בתוך הדפדפן זמינה כרגע ל-PDF ולתמונות בלבד.","קבצי DWG/DXF נשמרים עם היסטוריית גרסאות ומטא-דאטה, אך ללא תצוגה. המרה אוטומטית היא יכולת מתוכננת."]},{id:"h4",category:"שרטוטים",title:"הערות, ממצאים ומדידה על שרטוט",minutes:3,body:["במצב צפייה בוחרים כלי: הערה, ממצא או מדידה. ממצא אפשר להפוך למשימה בלחיצה.","המדידה בדמו היא מדידה ידנית לפי קנה המידה שהוגדר לשרטוט, ואינה מחליפה מדידה בשטח."]},{id:"h5",category:"פורטל לקוח",title:"מה הלקוח רואה בפורטל?",minutes:3,body:['הלקוח רואה רק פריטים שסומנו "משותף עם הלקוח": שרטוטים, מסמכים, פריטי מפרט, פגישות והתכתבות.',"הוא יכול לאשר, לדחות או לבקש שינוי. כל החלטה נרשמת בהיסטוריית האישורים."]},{id:"h6",category:"כספים",title:"תקציב ביצוע מול שכר טרחה",minutes:4,body:["תקציב ביצוע הוא הכסף של הלקוח שמיועד לקבלנים, ספקים ורכישות. שכר טרחה הוא התשלום למשרד.",'המערכת מציגה את שניהם בנפרד, ובנוסף "תמונה כספית כוללת" לפרויקט.']},{id:"h7",category:"מנוי וחיוב",title:"שדרוג, שנמוך וביטול מנוי",minutes:3,body:["שדרוג נכנס לתוקף מיד. שנמוך נכנס לתוקף בסוף תקופת החיוב (הנחת דמו).","בדמו אין חיוב אמיתי – כל החשבוניות מסומנות כהדמיה."]},{id:"h8",category:"מפרטים",title:"שליחת מפרט לאישור והוספת חלופות",minutes:3,body:["לכל פריט אפשר להוסיף חלופות עם מחיר והערה. הלקוח רואה את החלופות בפורטל ויכול לבחור.","סך המפרט מתעדכן אוטומטית ומשתקף בתקציב הביצוע."]}],Al=[{q:"האם הנתונים בדמו אמיתיים?",a:"לא. כל הנתונים בדויים ונשמרים רק בדפדפן שלך. אפשר לאפס אותם בכל רגע מהפס העליון."},{q:"האם אפשר להעלות קבצים אמיתיים בדמו?",a:"מסך ההעלאה מדמה את התהליך ויוצר רשומה, אבל הקובץ לא נשמר בשרת."},{q:"האם הלקוח יכול לראות תקציב?",a:"בדמו – רק סיכום תקציב ברמת פרויקט, אם המשרד בחר לשתף. זו הנחת דמו שתוגדר סופית בהמשך."},{q:"מה ההבדל בין Starter ל-Pro?",a:"טבלת ההשוואה בעמוד התמחור. חלוקת היכולות היא הנחת דמו וטרם אושרה."},{q:"האם ממצאי הבדיקה האוטומטית בשרטוט הם אישור הנדסי?",a:"לא. זו הדמיה של יכולת עתידית בלבד, ואין בה תחליף לבדיקה של איש מקצוע מוסמך."}],u2=io.map(t=>({...t,body:t.body.map(e=>({'בדמו, ההזמנות לא נשלחות בפועל ומופיעות ביומן המיילים כ"הודמה – לא נשלח".':"ההזמנה נשלחת במייל עם קישור אישי. הקישור תקף ל-14 יום ומתאים רק לכתובת שאליה נשלח.","המדידה בדמו היא מדידה ידנית לפי קנה המידה שהוגדר לשרטוט, ואינה מחליפה מדידה בשטח.":"לפני המדידה הראשונה מכיילים את השרטוט: מותחים קו על מידה ידועה ומזינים את אורכה. המדידה היא עזר בלבד ואינה מחליפה מדידה בשטח.","שדרוג נכנס לתוקף מיד. שנמוך נכנס לתוקף בסוף תקופת החיוב (הנחת דמו).":"שנמוך נכנס לתוקף בסוף תקופת החיוב. בסוף תקופת הניסיון, אם לא הוסדר מנוי, המשרד עובר למצב קריאה בלבד.","בדמו אין חיוב אמיתי – כל החשבוניות מסומנות כהדמיה.":"ספק הסליקה עדיין לא מחובר, ולכן בקשות לשינוי מסלול נרשמות ומטופלות על ידי צוות ArchiFlow."})[e]||e)}));var Vl=ct(jt(),1);function Pl(){return JSON.parse(JSON.stringify({office:eo,users:ao,memberships:Qo,invitations:tl,clients:el,
